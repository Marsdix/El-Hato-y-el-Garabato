<!DOCTYPE html>
<html lang="es" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>(function(){var t=localStorage.getItem('hato-theme');if(t)document.documentElement.setAttribute('data-theme',t);var l=localStorage.getItem('hato-lang');if(l)document.documentElement.lang=l;})()</script>
    <script>
      // Restaura la URL desde el redirect del 404.html de GitHub Pages
      (function(l){if(l.search[1]==='/'){var d=l.search.slice(1).split('&').map(function(s){return s.replace(/~and~/g,'&')});window.history.replaceState(null,null,l.pathname.slice(0,-1)+d[0]+(d[1]?'?'+d[1]:'')+l.hash)}}(window.location));
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />

    <!-- SEO -->
    <meta
      name="description"
      content="El Hato y el Garabato – Bodega artesanal en el Parque Natural Arribes del Duero, Zamora. Vinos de variedades ancestrales y viñas centenarias de más de 100 años."
    />
    <meta name="theme-color" content="#c8a255" />

    <!-- Open Graph (redes sociales) -->
    <meta property="og:title" content="El Hato y el Garabato — Bodega Arribes del Duero" />
    <meta
      property="og:description"
      content="Vinos artesanales de variedades ancestrales. 8 hectáreas de viñas centenarias en el Parque Natural Arribes del Duero, Zamora."
    />
    <meta property="og:type" content="website" />
    <!--
      Añadir cuando tengas dominio propio:
      <meta property="og:url" content="https://www.tudominio.com" />
      <meta property="og:image" content="https://www.tudominio.com/images/og-cover.jpg" />
    -->

    <title>El Hato y el Garabato — Bodega Arribes del Duero</title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&family=Jost:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
